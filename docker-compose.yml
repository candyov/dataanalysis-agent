services:
  backend:
    build: ./backend
    ports:
      - "8010:8010"
    environment:
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-pro}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com/v1}
      - APP_DEBUG=false
    volumes:
      - backend_storage:/app/storage
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_storage:
